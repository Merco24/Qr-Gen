<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>URL Shortener - Owntools</title>
    <style>
        .result-container {
            margin-top: 1.5rem;
            display: none;
            flex-direction: column;
            gap: 1rem;
            animation: fadeIn 0.3s ease;
        }

        .result-container.show {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .short-url-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--success-color);
            padding: 1rem;
            border-radius: 0.5rem;
        }

        .short-url-text {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--success-color);
            word-break: break-all;
        }

        .copy-btn {
            background: none;
            border: none;
            color: var(--secondary-text);
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 0.25rem;
            transition: background-color 0.2s, color 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .copy-btn:hover {
            background-color: rgba(0, 0, 0, 0.05);
            color: var(--text-color);
        }

        [data-theme="dark"] .copy-btn:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .error-message {
            color: var(--error-color);
            font-size: 0.875rem;
            margin-top: 0.5rem;
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">Owntools.</a>
            <nav class="nav-links">
                <a href="qrcode.html">QR Code</a>
                <a href="removebg.html">Remove BG</a>
                <a href="shorturl.html" class="active">Short URL</a>
                <button id="theme-toggle" aria-label="Toggle Dark Mode"></button>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="tool-layout">
            <div class="tool-header">
                <h1>URL Shortener</h1>
                <p>Paste a long URL below to create a short, easy-to-share link.</p>
            </div>

            <div class="card">
                <div class="input-group" style="text-align: left;">
                    <label for="url-input">Long URL</label>
                    <input type="url" id="url-input" class="input-field" placeholder="https://www.very-long-url-example.com/some/path">
                    <div id="error-msg" class="error-message">Please enter a valid URL.</div>
                </div>

                <button id="shorten-btn" class="btn" style="width: 100%;">Shorten URL</button>

                <!-- Result Box -->
                <div id="result-box" class="result-container">
                    <div class="short-url-box">
                        <a href="#" id="short-url-display" class="short-url-text" target="_blank">ownt.ls/xyz123</a>
                        <button id="copy-btn" class="copy-btn" title="Copy to clipboard">
                            <svg style="width: 20px; height: 20px;" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                            </svg>
                            <span id="copy-text">Copy</span>
                        </button>
                    </div>
                </div>

            </div>

            <p style="margin-top: 1rem; font-size: 0.85rem; color: var(--secondary-text);">
                Powered by the free <a href="https://is.gd" target="_blank" style="text-decoration: underline; color: var(--primary-color);">is.gd</a> API. No registration required.
            </p>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 Owntools. Crafted with care by Merco_Dev&Design.</p>
    </footer>

    <script src="js/main.js"></script>
    <script src="js/shorturl.js"></script>
</body>
</html>
